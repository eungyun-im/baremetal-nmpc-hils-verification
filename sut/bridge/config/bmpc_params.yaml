# bmpc_bridge 파라미터 (PC 브리지 + MCU 설정).
# sils.launch / replay_check.launch 가 bmpc_bridge 노드의 private 이름공간(/bmpc_bridge/...)으로 읽는다.
# 대회 스택의 전역 파라미터(mpc_path_tracking/config/mpc_params.yaml)와는 섞이지 않는다.
#
# 값의 출처
#   - 아래 앞부분: 대회 최종본 mpc_params.yaml(2026-10-27)에서 브리지·MCU 가 읽는 키만 옮겼다. 주석도 원본 그대로.
#   - "원본 yaml 에 없음" 표시가 붙은 키와 맨 뒤 묶음: 원본 yaml 에 없어 코드 기본값으로 돌던 값을 그대로 적었다.
# MCU 로 가는 값(N, dt, Lf, 가중치, 지연보상, 후처리 등)은 시작할 때 설정 프레임(0x0F0/0x0F1)으로 보내고
# MCU 가 해시로 확인한다.

# ---- mpc_params.yaml 에서 옮긴 값 ----
cost_weight:
  v_start_weight: 20
  delta_start_cost_weight: 30000
  steer_scale: 0.40
  v_target_cost_weight: 300
  v_target_change_cost_weight: 100
  steer_change_scale: 0.4 # 원본 yaml 에 없음: 코드 기본값 (= steer_scale)

speed_limit:
  urban_max_mps: 16.0 # 도심 (57.6 km/h, 규정 60 km/h 이하)
  highway_max_mps: 25.0 # 고주로 (90 km/h)

urban_control:
  curvature_lateral_accel_limit_mps2: 7.0 # 일반 코너 횡가속 한계 (급커브는 곡률 기준 감속 유지)
  curvature_rate_limit_up_mps2: 6.5 # 코너 탈출 시 곡률 속도 제한 회복
  cte_cost_start_weight: 5000.0 # 저속(코너) 세트 횡오차 가중치
  cte_cost_urban_weight: 750.0 # 고속(직선) 세트 횡오차 가중치
  epsi_cost_weight: 80000.0 # 헤딩 감쇠: 직선·코너 탈출 0.5 Hz 위빙과 저속 조향 떨림 억제
  delta_cost_start_weight: 2500.0 # 저속 미세 조향 억제
  delta_cost_high_speed_weight: 60000.0 # 고속 조향 억제
  delta_cost_start_mps: 8.5 # 이 속도까지 저속(코너) 세트
  delta_cost_full_mps: 11.5 # 이 속도부터 고속(직선) 세트 (42 km/h 순항이 고속 세트에 들도록)
  delta_change_cost_start_weight: 350000.0 # 코너 턴인/역조향 응답
  delta_change_cost_urban_weight: 1000000.0 # 고속 조향 슬루 억제
  preview_distance_m: 45.0 # 커브 감속 preview 거리 (m)
  max_speed_mps: 16.0 # 도심 최고속도 상한 (m/s)

avoidance_control:
  cte_cost_weight: 4000.0
  epsi_cost_weight: 4000.0
  delta_cost_weight: 12000.0
  delta_change_cost_weight: 350000.0
  lateral_accel_limit_mps2: 3.0
  curvature_min_speed_mps: 3.0 # 급한 회피 곡선에서 전역 최저속도(4.5)로 횡가속 한계를 넘지 않도록
  sections: [M2, M8]

highway_control:
  cte_cost_weight: 1000.0 # 고속 횡방향 과민 반응 완화
  epsi_cost_weight: 10500.0 # 헤딩 감쇠
  delta_cost_weight: 52000.0 # 고속 조향각 억제
  delta_change_cost_weight: 750000.0 # 고속 조향 변화율 억제
  preview_distance_m: 45.0 # 고속 제동거리용 preview (m)
  max_speed_mps: 25.0 # 고주로 최고속도 상한 (m/s)
k_v: 0.4
N: 30 # horizon 30*0.05 = 1.50 s (45 는 IPOPT 가 10 Hz 아래로 느려진다)
dt: 0.05
ref_v: 15.0 # 기본 순항 목표속도 (m/s). 실제 상한은 speed_limit / mission_speed 가 정한다

speed:
  upperBound: 40.0 # 솔버 변수 절대 상한 (주행 상한은 speed_limit 이 동적으로 클램핑)
  lowerBound: 0.0

steer:
  upperBound: 0.6981
  lowerBound: -0.6981
  command_sign: -1.0
  command_rate_limit_radps: 1.8
  output_lpf_enabled: true
  output_lpf_alpha: 0.65
  output_lpf_alpha_high_speed: 0.72 # 고속 조향 출력 고주파 진동 흡수
Lf: 4.0

longitudinal:
  throttle_kp: 0.22
  throttle_ki: 0.02
  throttle_integral_limit: 6.0
  throttle_integral_band_mps: 1.0
  throttle_accel_limit: 1.0
  throttle_accel_limit_exempt: 1.0
  throttle_brake_limit: 0.50
  kick_brake_limit: 1.0
  brake_rate_limit_per_sec: 2.0
  throttle_pedal_deadband: 0.04
  throttle_ff_gain: 1.0
  throttle_ff_accel_per_pedal_mps2: 3.5
  throttle_ff_tau_s: 0.3
  throttle_ff_min_accel_mps2: 0.6   # 정속 중 목표 잡음은 버리고 램프만 쓴다
  throttle_ff_taper_mps: 1.0        # 목표와 오차가 이보다 작으면 비례 감소 -> 램프 끝에서 목표를 넘지 않게
  throttle_ff_steer_zero_rad: 0.20  # |조향| 이 이 값 이상이면 FF 0 (급커브 출구에서 바깥으로 밀리는 것 방지)
  legal_guard:
    enabled: true
    cut_mps: 16.2        # 58.3 km/h 넘으면 가속 페달 0
    brake_at_mps: 16.4   # 59.0 km/h 넘으면 brake
    brake: 0.3

path_end_stop:
  enabled: true
  min_polyfit_points: 4
  approach_trigger_m: 30.0
  approach_decel_mps2: 1.5 # 원본 yaml 에 없음: 코드 기본값
  stop_margin_m: 1.0 # 원본 yaml 에 없음: 코드 기본값

mission_speed:
  enabled: true
  rate_limit_up_mps2: 3.0
  rate_limit_down_mps2: 3.0
  default_mps: 16.0
  state_0_mps: 16.0
  state_1_mps: 16.0
  state_2_mps: 16.0
  state_3_mps: 35.0 # 고주로 직선 상한
  state_4_mps: 20.0 # 고주로 곡선 상한
  state_5_mps: 16.0
  state_6_mps: 16.0
  state_7_mps: 16.0
  state_8_mps: 16.0
  state_9_mps: 16.0
  state_10_mps: 16.0
  state_11_mps: 16.0
  state_12_mps: 16.0

curvature_speed:
  enabled: true
  use_waypoint_rk: false
  fallback_to_polyfit: true # rk 가 없거나 너무 작으면 polyfit 곡률 사용
  lateral_accel_limit_mps2: 2.2 # 코너 진입 목표속도용 횡가속 한계 (약 0.22 g)
  min_speed_mps: 4.5 # 급커브 최소 속도 하한
  max_speed_mps: 0.0 # 0 이면 ref_v/speed.upperBound 중 작은 값
  preview_distance_m: 28.0 # 기본값 (주행 중에는 urban_control/highway_control 값으로 구간별 전환)
  min_lookahead_m: 0.5 # 바로 앞 피팅 노이즈 무시
  deadband_inv_m: 0.035 # R < 28 m 급커브 감속
  sample_count: 40
  percentile: 0.80 # 1.0 이면 max, 0.80 이면 상위 80% 곡률
  rate_limit_up_mps2: 4.0 # 커브 탈출 후 재가속
  rate_limit_down_mps2: 4.5 # 커브 진입 전 감속

delay_comp:
  enabled: true            # 끄려면 delay_comp:=false
  state_k: 1.0
  state_c_s: -0.004         # state_input/source 와 한 쌍 (ekf: -0.004, odom: 0.010)
  state_max_s: 0.12
  actuation_base_s: 0.06
  actuation_frame_k: 0.5
  model_lf: 4.0            # 사전값 (MORAI 실측 실효 Lf)
  lf_online: true          # 곡선에서 실효 Lf 를 실시간 측정해 사전값을 대체
  fallback_period_s: 0.020 # /imu 가 끊기면 50 Hz 로 가정
  compute_max_s: 0.10

state_input:
  source: ekf

state_filter:
  enabled: true
  pos_tau_s: 1.0 # 원본 yaml 에 없음: 코드 기본값
  yaw_tau_s: 1.0 # 원본 yaml 에 없음: 코드 기본값
  kappa_full: 0.004 # 원본 yaml 에 없음: 코드 기본값
  kappa_zero: 0.012 # 원본 yaml 에 없음: 코드 기본값
  preview_s: 2.5 # 원본 yaml 에 없음: 코드 기본값
  yaw_rate_full_radps: 0.03 # 원본 yaml 에 없음: 코드 기본값
  yaw_rate_zero_radps: 0.1 # 원본 yaml 에 없음: 코드 기본값
  straightness_up_rate_per_s: 0.5 # 원본 yaml 에 없음: 코드 기본값
  max_lat_offset_m: 0.04 # 원본 yaml 에 없음: 코드 기본값
  max_yaw_offset_deg: 0.3 # 원본 yaml 에 없음: 코드 기본값
  reset_pos_m: 0.3 # 원본 yaml 에 없음: 코드 기본값
  reset_yaw_deg: 3.0 # 원본 yaml 에 없음: 코드 기본값

# ---- 원본 yaml 에 묶음 자체가 없던 키: 원본 코드 기본값 ----
external_acc:
  enabled: true
  timeout_sec: 0.5
bmpc:
  sqp_iters: 3
  qp_max_iters: 200
  dc_compute_init_s: 0.03
  transport_req_share: 0.6
  dc_compute_fixed_s: 0.0
  sqp_tol: 0.0001

# 브리지 동작 (응답 없을 때 유지 주기, 설정 응답 대기, 제어 주기)
config_timeout_s: 0.5
fallback_hold_cycles: 3
loop_rate_hz: 20.0
